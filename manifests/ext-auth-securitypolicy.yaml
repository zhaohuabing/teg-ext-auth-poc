# 1. Create a root certificate and private key to sign certificates:

# openssl req -x509 -sha256 -nodes -days 365 -newkey rsa:2048 -subj '/O=example Inc./CN=example.com' -keyout example.com.key -out example.com.crt

# 2.Create a certificate and a private key for www.example.com:

# openssl req -out www.example.com.csr -newkey rsa:2048 -nodes -keyout www.example.com.key -subj "/CN=www.example.com/O=example organization"
# openssl x509 -req -days 365 -CA example.com.crt -CAkey example.com.key -set_serial 0 -in www.example.com.csr -out www.example.com.crt

# 3.Create a certificate and a private key for the client client.example.com:

# openssl req -out client.example.com.csr -newkey rsa:2048 -nodes -keyout client.example.com.key -subj "/CN=client.example.com/O=example organization"
# openssl x509 -req -days 365 -CA example.com.crt -CAkey example.com.key -set_serial 0 -in client.example.com.csr -out client.example.com.crt


apiVersion: v1
data:
  tls.key: 
  tls.crt: 
  ca.crt: 
kind: Secret
metadata:
  name: client-mtls-certificate
type: kubernetes.io/tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ext-auth-poc
spec:
  gatewayClassName: teg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: custom-proxy-config
  listeners:
  - name: http
    protocol: HTTP
    port: 80
  - name: mtls
    port: 443
    protocol: HTTPS
    hostname: www.example.com
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: client-mtls-certificate
      mode: Terminate
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ext-auth-poc
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ext-auth-poc
  rules:
  - matches:
    - headers:
      - type: Exact
        name: x-current-user
        value: user1
    backendRefs:
    - group: ""
      kind: Service
      name: backend-app-v1
      port: 8080
  - matches:
    - headers:
      - type: Exact
        name: x-current-user
        value: user2
    backendRefs:
    - group: ""
      kind: Service
      name: backend-app-v2
      port: 8080
  - backendRefs:
    - group: ""
      kind: Service
      name: backend-app
      port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ext-auth-poc
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: ext-auth-poc
  extAuth:
    recomputeRoute: true
    headersToExtAuth: [ "X-Forwarded-Client-Cert" ]
    http:
      headersToBackend: [ "x-current-user" ]
      backendRefs:
      - name: ext-auth-svc
        kind: Backend
        group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: ctp-client-mtls
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: ext-auth-poc
    sectionName: mtls
  headers:
    xForwardedClientCert:
      certDetailsToAdd:
      - Subject
      mode: SanitizeSet
  tls:
    clientValidation:
      caCertificateRefs:
      - kind: "Secret"
        group: ""
        name: "client-mtls-certificate"
